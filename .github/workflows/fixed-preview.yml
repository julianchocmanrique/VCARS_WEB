name: VCARS Fixed Preview
on:
  push:
    branches: [codex/vcars-fixed-preview]
    paths: [deploy/preview/**, .github/workflows/fixed-preview.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vcars-fixed-preview
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-preview]')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate deployment manifest
        id: manifest
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          const m=JSON.parse(fs.readFileSync('deploy/preview/release.json'));
          if (!/^vcars-preview-[a-z0-9-]+$/.test(m.release) || !/^[a-f0-9]{64}$/.test(m.sha256)) throw new Error('Invalid release');
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release=${m.release}\nsha256=${m.sha256}\n`);
          JS
      - name: Fetch authenticated encrypted package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE: ${{ steps.manifest.outputs.release }}
        run: gh release download "$RELEASE" --repo "$GITHUB_REPOSITORY" --pattern release.enc
      - name: Verify integrity and decrypt privately
        env:
          VCARS_PREVIEW_PACKAGE_KEY: ${{ secrets.VCARS_PREVIEW_PACKAGE_KEY }}
          PACKAGE_HASH: ${{ steps.manifest.outputs.sha256 }}
        run: node deploy/preview/decrypt.mjs release.enc release.tar.gz "$PACKAGE_HASH"
      - name: Transfer release over SSH
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:NGtvJn174wF1zFpNQLSnoFrG+ezDvAfzpMq7zPH/F3A
          source: release.tar.gz,deploy/preview/apply.sh
          target: /opt/vcars-preview/incoming/${{ github.sha }}
          timeout: 60s
          command_timeout: 10m
      - name: Deploy without changing other applications
        uses: appleboy/ssh-action@v1.2.0
        env:
          RELEASE: ${{ steps.manifest.outputs.release }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: SHA256:NGtvJn174wF1zFpNQLSnoFrG+ezDvAfzpMq7zPH/F3A
          envs: RELEASE
          timeout: 60s
          command_timeout: 30m
          script: |
            bash /opt/vcars-preview/incoming/${{ github.sha }}/deploy/preview/apply.sh /opt/vcars-preview/incoming/${{ github.sha }} "$RELEASE"
      - name: Remove runner plaintext archive
        if: always()
        run: rm -f release.tar.gz
