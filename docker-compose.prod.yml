services:
  vcars_web_prod:
    build: .
    container_name: vcars-web-prod
    env_file:
      - .env.prod
    environment:
      API_PROXY_TARGET: http://vcars-api-api-1:4000
    ports:
      - "0.0.0.0:3030:3000"
    networks:
      - default
      - vcars_api_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/vcars/login/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  vcars_api_net:
    external: true
    name: vcars-api_default
