services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: vcars
      POSTGRES_USER: vcars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required}
    volumes:
      - /opt/vcars-preview/data/postgres:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, pg_isready -U vcars -d vcars]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    image: vcars-preview-api:${RELEASE_ID:?Required}
    build: ${RELEASE_DIR:?Required}/api
    environment:
      DATABASE_URL: postgresql://vcars:${POSTGRES_PASSWORD}@db:5432/vcars
      JWT_SECRET: ${JWT_SECRET:?Required}
      APP_ENV: production
      NODE_ENV: production
      SEED_DEMO_USERS: 'false'
      CORS_ORIGIN: ${PUBLIC_ORIGIN:?Required}
      UPLOAD_DIR: /app/uploads/service-orders
      PORT: '4000'
    volumes:
      - /opt/vcars-preview/data/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:4000/health >/dev/null || exit 1']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 30s
  web:
    image: vcars-preview-web:${RELEASE_ID:?Required}
    build: ${RELEASE_DIR:?Required}/web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ''
      API_PROXY_TARGET: http://api:4000
    ports:
      - 127.0.0.1:3013:3000
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'node -e "fetch(''http://127.0.0.1:3000/vcars/api/backend/health/'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 15s
  gateway:
    image: node:22-alpine
    command: [node, /app/gateway.mjs]
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?Required}
    volumes:
      - ${RELEASE_DIR}/deploy/gateway.mjs:/app/gateway.mjs:ro
      - /opt/vcars-preview/review-key:/run/secrets/review-key:ro
    ports:
      - 127.0.0.1:3014:3000
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
